bundle:
  name: lakehouse-compass

# Lakehouse Compass — the Databricks platform doctor.
# Phase 0: deployable AppKit shell in DEMO_MODE + compass_core rule engine
# skeleton + a demo scan job. See DECISIONS.md for phasing.

include:
  - resources/*.yml
  # Optional, gitignored: customer-specific targets (never committed to this public repo).
  - "*.local.yml"

variables:
  sql_warehouse_id:
    description: SQL Warehouse the app uses to read <catalog>.lakehouse_compass.* Delta.
    default: 4e6fdb0b5307a9f1
  compass_catalog:
    description: Catalog holding the lakehouse_compass schema (per workspace; main is not always accessible).
    default: moi_ai_catalog
  compass_schema:
    description: Schema holding the Compass tables.
    default: lakehouse_compass
  compass_workspace_id:
    description: Numeric id of the workspace the scan/report/digest jobs target.
    default: "7474658545709121"
  app_service_principal:
    description: The Compass app's service principal (grants + report-job CAN_MANAGE_RUN). Set per target after the app's first deploy.
    default: 9e5eaa76-9282-4a5a-be66-41397adf8313
  compass_llm_endpoint:
    description: Serving endpoint bound to the Compass Agent (compass-llm). Must exist in the target workspace.
    default: databricks-claude-sonnet-4-5

targets:
  # dev is the default target for Phase 0 work.
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-moi-ai.cloud.databricks.com
      # Per-user root so multiple developers never collide.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  staging:
    mode: development
    workspace:
      host: https://fevm-moi-ai.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      host: https://fevm-moi-ai.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - level: CAN_MANAGE
        user_name: ${workspace.current_user.userName}

  # Customer-specific targets (e.g. engie-noprod) live in a gitignored
  # databricks.local.yml so this public repo carries only generic config.
