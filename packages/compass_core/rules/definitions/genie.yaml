rules:
  - id: GEN-001
    domain: genie
    title: Genie Agents missing descriptions / instructions
    description: >
      Genie Agents without descriptions and curated instructions give the model
      little grounding, producing lower-quality and inconsistent answers.
    severity: medium
    level: RECOMMENDED
    requires: [genie]
    frameworks: ["DBX-SBP:GOV-2"]
    waf_pillars: [data_ai_governance, interoperability_usability]
    agent_explainer: >
      Agents without descriptions/instructions guess. Add a clear description,
      instructions and certified sample questions to each Genie Agent.
    remediation: >
      Add descriptions, instructions and certified sample questions to each
      Genie Agent; curate its table set.
    docs:
      - https://docs.databricks.com/genie/

  - id: GEN-COST-001
    domain: genie
    title: Genie Code users past the free allowance are billing
    description: >
      Genie Code ships a monthly free allowance (150 DBUs/user); usage beyond it
      is billed. Users consistently past the allowance drive spend that should be
      attributed to a named user and reviewed, especially service-principal
      traffic which receives no free allowance.
    severity: medium
    level: CONTEXT_DEPENDENT
    requires: [billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      One or more Genie Code users have exhausted the 150 DBU/month free
      allowance and are now billing. Attribute the spend to named users and
      confirm the paid usage is expected.
    remediation: >
      Review Genie Code consumers past the free allowance; attribute usage to
      named users, set expectations on paid consumption, and watch
      service-principal Genie traffic which gets no free allowance.
    docs:
      - https://docs.databricks.com/genie/

  - id: GEN-013
    domain: genie
    title: Genie Agents built on tables without certified metric views
    description: >
      Genie Agents answering on core business metrics without certified UC
      metric views risk semantic drift and inconsistent answers versus governed
      dashboards.
    severity: medium
    level: RECOMMENDED
    requires: [genie, tags]
    frameworks: ["DBX-SBP:GOV-2"]
    waf_pillars: [data_ai_governance]
    agent_explainer: >
      When a Genie Agent computes core metrics ad hoc instead of from a certified
      metric view, answers can drift from the governed definition. Point it at a
      certified metric view.
    remediation: >
      Define UC metric views for the agent's core metrics, certify them, and add
      them to the Genie Agent's table set and instructions.
    docs:
      - https://docs.databricks.com/genie/
