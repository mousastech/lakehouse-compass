rules:
  - id: SEC-027
    domain: security
    title: App/agent service principal holds MANAGE or ALL PRIVILEGES on a catalog
    description: >
      A service principal used by an app or agent that owns MANAGE or ALL
      PRIVILEGES on a catalog violates least privilege: a compromise or bug can
      read, alter or drop any object in the catalog.
    severity: critical
    level: REQUIRED
    requires: [access, tags]
    frameworks: ["DBX-SBP:IAM-3", "ISO27001:A.5.15", "SOC2:CC6.1"]
    waf_pillars: [security, data_ai_governance]
    maintenance: null
    agent_explainer: >
      This SP can act on every object in the catalog. Scope its grants to the
      exact schemas it needs and remove catalog-level MANAGE/ALL PRIVILEGES.
    remediation: >
      REVOKE ALL PRIVILEGES ON CATALOG <catalog> FROM `<sp>`; then GRANT only the
      minimum (USE CATALOG, USE SCHEMA, SELECT) on the specific schemas required.
    docs:
      - https://docs.databricks.com/data-governance/unity-catalog/manage-privileges/

  - id: SEC-029
    domain: security
    title: Workspace still allows PATs where OAuth is feasible
    description: >
      Personal access tokens are long-lived bearer credentials. Where OAuth /
      service-principal OAuth is feasible, PATs should be disabled to reduce
      credential sprawl and theft risk.
    severity: high
    level: CONTEXT_DEPENDENT
    requires: [access]
    frameworks: ["DBX-SBP:IAM-5", "CIS:1.2", "NIST-CSF:PR.AA"]
    waf_pillars: [security]
    agent_explainer: >
      PATs are long-lived and hard to rotate. Prefer OAuth. If PATs are still
      needed, cap their lifetime and inventory their owners.
    remediation: >
      Disable Personal Access Tokens in the workspace admin settings, or set a
      short max lifetime, and migrate integrations to OAuth (U2M/M2M).
    docs:
      - https://docs.databricks.com/dev-tools/auth/

  - id: SEC-014
    domain: security
    title: Broad privileges granted to all-account-users groups
    description: >
      Granting MODIFY / ALL PRIVILEGES to `account users` (or `users`) on
      catalogs or schemas gives every workspace user write/administrative access
      to governed data, defeating least privilege.
    severity: critical
    level: REQUIRED
    requires: [tags]
    frameworks: ["DBX-SBP:IAM-3", "CIS:1.1", "ISO27001:A.5.15"]
    waf_pillars: [security, data_ai_governance]
    agent_explainer: >
      Everyone in the account can modify or fully control these objects. Replace
      the broad group grant with scoped grants to the specific teams that need it.
    remediation: >
      REVOKE the broad privilege from `account users`; GRANT the minimum needed
      to the specific groups/service principals that require it.
    docs:
      - https://docs.databricks.com/data-governance/unity-catalog/manage-privileges/

  - id: SEC-030
    domain: security
    title: ABAC tagging privileges (ASSIGN / APPLY TAG) granted broadly
    description: >
      Governed tags drive ABAC row-filter / column-mask policies, so the ability
      to apply tags is a security boundary. Broad ASSIGN/APPLY TAG grants let
      users move data in and out of protected policy scopes.
    severity: high
    level: REQUIRED
    requires: [tags]
    frameworks: ["DBX-SBP:GOV-1", "ISO27001:A.8.3"]
    waf_pillars: [security, data_ai_governance]
    agent_explainer: >
      Whoever can apply governed tags can effectively change who sees masked
      data. Restrict APPLY TAG to a small stewardship group.
    remediation: >
      Review GRANTs of APPLY TAG / ASSIGN on governed tag policies and restrict
      to the data-governance stewardship group.
    docs:
      - https://docs.databricks.com/data-governance/unity-catalog/tags.html

  - id: SEC-040
    domain: security
    title: Sensitive columns without a visible mask
    description: >
      Columns tagged with a sensitivity-role tag (class.*, pii, phi… via the
      Tag Profile) or detected with HIGH confidence by Data Classification that
      have neither a direct column mask nor a matching ABAC column-mask policy
      on the table or an ancestor. ABAC policies are only visible where the
      scan identity has MANAGE.
    severity: high
    level: REQUIRED
    requires: [tags, abac_policies]
    frameworks: ["DBX-SBP:DATA-1", "LGPD:Art.46", "GDPR:Art.32"]
    waf_pillars: [security, data_ai_governance]
    agent_explainer: >
      These columns are known to be sensitive but anyone with SELECT reads them
      in clear. One ABAC column-mask policy on the sensitivity tag, attached at
      catalog or schema level, protects all of them at once.
    remediation: >
      Create an ABAC COLUMN_MASK policy matching the sensitivity tag at catalog
      or schema level, or attach a column mask to each column.
    docs:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/abac/

  - id: SEC-041
    domain: security
    title: Detected sensitive columns not tagged
    description: >
      HIGH-confidence Data Classification detections with no tag on the
      column, so tag-based ABAC policies do not cover them. Requires SELECT on
      system.data_classification.results (never reads the samples column).
    severity: medium
    level: RECOMMENDED
    requires: [data_classification]
    frameworks: ["DBX-SBP:DATA-1"]
    waf_pillars: [security, data_ai_governance]
    agent_explainer: >
      Classification found sensitive data but nothing tagged it, so policies
      built on tags skip it. Turn on automatic tagging after reviewing results.
    remediation: >
      Review detections and enable automatic tagging on the catalog.
    docs:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification

  - id: SEC-042
    domain: security
    title: Columns that look sensitive by name are not classified
    description: >
      Heuristic: column names such as email, cpf, phone, address, salary or
      customer_name with no sensitivity tag, no detection and no mask. A prompt
      to confirm with Data Classification, not proof of sensitive content.
    severity: low
    level: RECOMMENDED
    requires: [tags]
    frameworks: ["DBX-SBP:DATA-1"]
    waf_pillars: [security]
    agent_explainer: >
      These names usually hold personal data. Confirm with Data Classification
      and tag what is real so masks and ABAC policies can apply.
    remediation: >
      Enable Data Classification on these catalogs or tag the confirmed columns.
    docs:
      - https://docs.databricks.com/aws/en/data-governance/unity-catalog/data-classification
