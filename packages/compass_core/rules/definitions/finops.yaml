rules:
  - id: FIN-028
    domain: finops
    title: Serving endpoints without spend caps
    description: >
      Model serving / Unity AI Gateway endpoints without a configured budget or
      spend cap can run away in cost, especially agent traffic on frontier
      models.
    severity: high
    level: RECOMMENDED
    requires: [ai_gateway, billing]
    frameworks: ["DBX-SBP:MON-2"]
    waf_pillars: [cost_optimization]
    agent_explainer: >
      Without a spend cap, a traffic spike or a runaway agent bills without a
      ceiling. Set a budget on the endpoint and alert on approach.
    remediation: >
      Configure a spend cap / budget on the endpoint via Unity AI Gateway and
      enable usage tracking so spend is attributed by user, team and use case.
    docs:
      - https://docs.databricks.com/ai-gateway/

  - id: FIN-027
    domain: finops
    title: Spend without user/team/use-case attribution
    description: >
      Usage that cannot be attributed to a run-as identity, team or use case
      (no owner metadata, no cost tags) makes chargeback and accountability
      impossible and hides runaway consumers.
    severity: high
    level: RECOMMENDED
    requires: [billing]
    frameworks: ["DBX-SBP:MON-2"]
    waf_pillars: [cost_optimization]
    agent_explainer: >
      A large share of spend has no owner identity. Tag workloads by team and
      use case, and prefer run-as service principals so cost is attributable.
    remediation: >
      Adopt a cost-tag policy (team, use_case, environment) enforced via tag
      policies; set run-as identities on jobs and endpoints; enable Gateway
      budgets for AI spend.
    docs:
      - https://docs.databricks.com/admin/account-settings/usage.html

  - id: FIN-030
    domain: finops
    title: Genie consumption without free-allowance attribution
    description: >
      Genie usage driven by service principals gets no free allowance, and
      per-user Genie consumption should be attributed and compared to the free
      allowance to avoid surprise cost.
    severity: medium
    level: CONTEXT_DEPENDENT
    requires: [billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      Genie spend is present. Confirm it is attributed to identified users
      (who get a free allowance) rather than service principals.
    remediation: >
      Attribute Genie usage to named users; review SP-driven Genie traffic which
      receives no free allowance.
    docs:
      - https://docs.databricks.com/genie/

  - id: FIN-104
    domain: finops
    title: Idle serving endpoint (zero traffic, still billing)
    description: >
      A model serving / Unity AI Gateway endpoint that served zero requests over
      the window but keeps billing always-on compute. system.serving.endpoint_usage
      is a per-request log, so "nobody calls this" is counted, not inferred.
    severity: medium
    level: RECOMMENDED
    requires: [serving, billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      This endpoint has no traffic but bills continuously. Scale it to zero or
      delete it — the reclaimed dollar is its own measured billed cost.
    remediation: >
      Scale the endpoint to zero (min_concurrency=0, scale-to-zero is GA) or
      delete it if it is no longer needed.
    docs:
      - https://docs.databricks.com/machine-learning/model-serving/scale-to-zero.html

  - id: FIN-101
    domain: finops
    title: Cluster without (or with loose) auto-termination
    description: >
      An all-purpose cluster that ran idle for a large share of measured minutes
      (avg CPU below 10%) with no or a loose auto-termination keeps billing while
      doing nothing. Idle minutes are measured from node_timeline, not inferred.
    severity: medium
    level: RECOMMENDED
    requires: [compute, billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      This cluster sits idle but stays on. Enable or tighten auto-termination so
      it stops when idle — the reclaimed dollar is measured idle time × its rate.
    remediation: >
      Enable auto-termination (e.g. 15 minutes) on the cluster so it shuts down
      after a period of inactivity.
    docs:
      - https://docs.databricks.com/compute/clusters-manage.html

  - id: FIN-102
    domain: finops
    title: Warehouse auto-stop too loose (classic/PRO)
    description: >
      A classic/PRO SQL warehouse with no or a long auto-stop stays warm through
      long idle gaps between queries. A shorter auto-stop trades idle warm-pool
      cost against a billed cold-start restart.
    severity: medium
    level: RECOMMENDED
    requires: [query, billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      This warehouse keeps warm through long idle gaps. Lower its auto-stop to
      reclaim warm-pool cost (estimated — rests on a modelled counterfactual).
    remediation: >
      Lower the SQL warehouse auto-stop (e.g. to 10 minutes).
    docs:
      - https://docs.databricks.com/compute/sql-warehouse/warehouse-behavior.html

  - id: FIN-103
    domain: finops
    title: Serverless warehouse auto-stop too loose
    description: >
      A serverless SQL warehouse with a large warm/active ratio reclaims real
      idle-tail cost by shortening its auto-stop toward the 5-minute floor.
      Serverless starts in seconds, so there is no meaningful cold-start penalty.
    severity: medium
    level: RECOMMENDED
    requires: [query, billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      This serverless warehouse bills a long warm idle tail. Shorten its auto-stop
      to 5 minutes — reclaimed idle is measured from per-query gaps.
    remediation: >
      Set the serverless warehouse auto-stop to 5 minutes (restarts are near-instant).
    docs:
      - https://docs.databricks.com/compute/sql-warehouse/warehouse-behavior.html

  - id: FIN-105
    domain: finops
    title: Recurring jobs on an all-purpose cluster
    description: >
      Recurring jobs running on an all-purpose cluster pay the all-purpose rate
      for work that jobs compute runs at a lower rate. Moving them to job clusters
      captures the price gap.
    severity: medium
    level: RECOMMENDED
    requires: [lakeflow, compute, billing]
    frameworks: []
    waf_pillars: [cost_optimization]
    agent_explainer: >
      Recurring jobs use an all-purpose cluster. Move them to jobs compute to pay
      the lower jobs-compute rate on that work.
    remediation: >
      Convert recurring jobs to run on job clusters (jobs compute) instead of an
      all-purpose cluster.
    docs:
      - https://docs.databricks.com/jobs/compute.html

  - id: FIN-029
    domain: finops
    title: Lakebase idle projects or non-scale-to-zero compute
    description: >
      Lakebase projects that never scale to zero on non-production compute, or
      idle projects still incurring cost, and snapshot storage growth or
      lingering dev branches, leak spend.
    severity: medium
    level: RECOMMENDED
    requires: [lakebase, billing]
    frameworks: ["DBX-SBP:MON-4"]
    waf_pillars: [cost_optimization]
    maintenance:
      recurrence: weekly
      lead_days: 0
    agent_explainer: >
      Non-prod Lakebase compute that never scales to zero bills around the clock.
      Enable scale-to-zero and prune idle branches and snapshots.
    remediation: >
      Enable scale-to-zero on non-production Lakebase compute; delete idle dev
      branches past the max-age policy; define a snapshot retention policy.
    docs:
      - https://docs.databricks.com/oltp/
