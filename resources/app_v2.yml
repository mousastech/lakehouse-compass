resources:
  apps:
    compass_v2_app:
      name: lakehouse-compass-v2
      description: "Lakehouse Compass v2 — the domain-contract experience (A/B vs v1). Reuses the same compass_core engine and Delta tables; read-only. Home triage + per-domain 'north + what to do now + why + 1-click (draft / teach me)'."
      source_code_path: ../app-v2

      # Same bindings as v1: reads the scan job's Delta via the SQL warehouse, and
      # the Compass Agent / "teach me" calls the governed serving endpoint.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: compass-llm
          serving_endpoint:
            name: ${var.compass_llm_endpoint}
            permission: CAN_QUERY
