resources:
  jobs:
    compass_report:
      name: lakehouse-compass-report-${bundle.target}
      description: "Lakehouse Compass — premium PDF diagnostic report for a workspace_id + scan_id. Writes to the reports UC Volume and appends a checkup_reports row."
      tags:
        project: lakehouse-compass
        phase: "1"

      # Allow the app's service principal to trigger this job (Generate report button).
      permissions:
        - level: CAN_MANAGE_RUN
          service_principal_name: ${var.app_service_principal}

      parameters:
        - name: workspace_id
          default: "${var.compass_workspace_id}"
        - name: scan_id
          default: ""

      tasks:
        - task_key: report
          spark_python_task:
            python_file: ../jobs/report/run_checkup.py
            parameters:
              - "--catalog"
              - "${var.compass_catalog}"
              - "--schema"
              - "${var.compass_schema}"
              - "--volume"
              - "reports"
              - "--workspace_id"
              - "{{job.parameters.workspace_id}}"
              - "--scan_id"
              - "{{job.parameters.scan_id}}"
              - "--app_sp"
              - "${var.app_service_principal}"
          environment_key: report_env

      environments:
        - environment_key: report_env
          spec:
            client: "3"
            dependencies:
              - weasyprint
              - markdown
              - pyyaml
